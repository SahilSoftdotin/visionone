# VisionOne login copy.
#
# Overriding the message bundle rather than the template: Keycloak keeps owning login.ftl, so
# OTP, password reset and consent keep working and nothing has to be re-forked at the next
# upgrade. Only the strings the sign-in page actually shows are here.

# "Sign in to your account" wrapped onto three lines at heading size and said nothing a heading
# needs to say. The subtitle that carries the product name is in the stylesheet, since a theme
# that does not fork the template cannot add an element.
loginAccountTitle=Welcome back
doLogIn=Log In

# Sentence case, to match every other label on the page.
doForgotPassword=Forgot password?

# Shown on every info page that has somewhere to go back to - most visibly after a password reset
# completes. Keycloak's own wording is "Back to Application", which names nothing the person
# recognises and reads like a developer's placeholder on a page that is otherwise the end of a
# flow they were emailed into.
backToApplication=Continue to VisionOne
backToLogin=Back to sign in
