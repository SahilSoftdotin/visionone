# VisionOne login theme.
#
# Extends keycloak.v2 (PatternFly 5) rather than replacing it, so Keycloak keeps owning the
# markup, the error states, and every flow we have not thought about - OTP, password reset,
# consent. We only restyle. A forked template is a template that rots at the next upgrade.
parent=keycloak.v2
import=common/keycloak

# The parent's stylesheet first, ours last, so ours wins without !important everywhere.
#
# ?v=2 is a one-time cache bust, and it is needed because of a real trap. Keycloak used to serve
# theme assets with a 30-day Cache-Control, and the resource path it serves them under only
# changes between Keycloak VERSIONS - never when a theme file changes. docker-compose.prod.yml now
# sets --spi-theme-static-max-age=60, but that only governs fetches made from then on: every
# browser that had already loaded the old stylesheet keeps it, at the same URL, for up to thirty
# days. Changing the URL once is the only thing that reaches those browsers.
#
# Future theme changes should not need this. If one ever does, bump the number rather than
# renaming the file.
styles=css/styles.css css/visionone.css?v=4

# Marks both fields on a failed sign-in and clears the mark on first edit. Keycloak marks only the
# username, and the realm deliberately does not say which of the two was wrong, so highlighting one
# of them points at the username as if we knew. See the file for the reasoning.
scripts=js/login-errors.js
