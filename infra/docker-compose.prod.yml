# The demo deployment: one host, three containers, one public port.
#
# Differences from docker-compose.yml, which stays the local development stack:
#   - Nothing but Caddy publishes a port. Postgres, Keycloak and the API are reachable only on the
#     internal network, so the database is not on the internet because someone forgot a firewall.
#   - Every credential comes from .env.prod. No password is written in this file.
#   - Keycloak runs `start`, not `start-dev`, behind a proxy that terminates TLS.
#   - Three containers, not four. Events travel in-process, drained from outbox_event by a poller,
#     so there is no broker to run here or anywhere else.

name: visionone-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: visionone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: visionone
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionone -d visionone"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--import-realm", "--http-port=8180"]
    environment:
      # Keycloak builds absolute URLs (issuer, redirects, the theme's asset paths) from this, so it
      # must be the public HTTPS origin even though Caddy speaks plain HTTP to the container.
      KC_HOSTNAME: https://${DOMAIN:?set DOMAIN in .env.prod}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: visionone
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env.prod}
    volumes:
      # The rendered realm, not the one in git: redirect URIs and user passwords are substituted
      # for this host by scripts/render-realm.py.
      - ./keycloak/generated:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      # "The instance Gary is shown": seeded dataset, no dev endpoints, all four provider ports
      # reporting DEMO rather than pretending to be connected.
      SPRING_PROFILES_ACTIVE: demo
      VISIONONE_DB_URL: jdbc:postgresql://postgres:5432/visionone
      VISIONONE_DB_USER: visionone
      VISIONONE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      VISIONONE_OIDC_ISSUER: https://${DOMAIN}/realms/visionone
      # Signing keys come straight from Keycloak on the internal network. The issuer above stays
      # the public HTTPS origin - it is the value in the token and it is still checked - but the
      # API must not try to FETCH it: inside this container "localhost" is this container, and
      # even with a real domain it would mean leaving the host over TLS to come straight back in.
      VISIONONE_OIDC_JWK_SET_URI: http://keycloak:8180/realms/visionone/protocol/openid-connect/certs
      # Same origin through Caddy, so this is belt and braces rather than load-bearing.
      VISIONONE_CORS_ORIGINS: https://${DOMAIN}
      # Hourly rather than the 1s and 5s that suit a laptop. A Healthie webhook still lands
      # immediately - the endpoint verifies it, writes one inbox row and returns in milliseconds,
      # which is what keeps Healthie from retiring the subscription. Only the drain waits, and a
      # marketing dashboard does not need a booking to appear within five seconds of being made.
      # Override either if something turns out to want lower latency; both are plain properties.
      VISIONONE_EVENTING_INBOX_INTERVAL_MS: ${VISIONONE_EVENTING_INBOX_INTERVAL_MS:-3600000}
      VISIONONE_EVENTING_DISPATCHER_INTERVAL_MS: ${VISIONONE_EVENTING_DISPATCHER_INTERVAL_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: ../frontend
      args:
        VITE_OIDC_AUTHORITY: https://${DOMAIN}/realms/visionone
        VITE_OIDC_REDIRECT_URI: https://${DOMAIN}/
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
