spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
visionone:
  cors:
    allowed-origins: http://localhost:5173
  eventing:
    # Tests drive the dispatcher explicitly where they need it, so the scheduler stays off and a
    # test can assert on unpublished outbox rows without racing it.
    dispatcher:
      enabled: false
    inbox:
      enabled: false
