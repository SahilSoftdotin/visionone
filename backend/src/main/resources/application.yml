spring:
  application:
    name: visionone-api
  datasource:
    url: ${VISIONONE_DB_URL:jdbc:postgresql://localhost:5432/visionone}
    username: ${VISIONONE_DB_USER:visionone}
    password: ${VISIONONE_DB_PASSWORD:visionone}
    hikari:
      maximum-pool-size: 10
      pool-name: visionone-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema. Hibernate only checks it.
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${VISIONONE_OIDC_ISSUER:http://localhost:8180/realms/visionone}

server:
  port: 8080
  error:
    include-message: never

visionone:
  cors:
    allowed-origins: ${VISIONONE_CORS_ORIGINS:http://localhost:5173}
  eventing:
    # Postgres is the queue. The dispatcher drains outbox_event to the in-process handlers;
    # the inbox processor drains webhooks that arrived from a provider.
    dispatcher:
      enabled: true
      interval-ms: 1000
      batch-size: 100
    inbox:
      enabled: true
      interval-ms: 5000
      batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: visionone-api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.visiondigitallab.visionone: INFO
    org.hibernate.SQL: WARN
