# Build the two images here, not on the server.
#
# The box VisionOne runs on is a single shared core with 2 GB of RAM. It can compile both images -
# verified, the jar builds inside a hard 1 GB container - but it takes twenty minutes or more, and it
# does it while the old stack is still serving the client. GitHub's runners do the same work in a few
# minutes on hardware that is already paid for, so the server's job becomes `docker pull`.
#
# Cost: a private repository gets 2,000 free Linux minutes a month and this uses roughly 6 of them
# per deploy. GHCR storage and bandwidth are free, though GitHub words that as "currently free".
#
# The tests gate the publish. Until now there was no CI at all, so a broken commit reached the server
# and was discovered there.

name: Build and publish images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight build pointless; cancelling it saves minutes.
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The backend suite runs against a real Postgres through Testcontainers - the runner's Docker
      # daemon is what makes that work here. "A schema that only works in H2 is not a schema that
      # works", per the suite's own base class, so this is not swapped for an in-memory database.
      - name: Backend tests
        working-directory: backend
        run: ./gradlew --no-daemon test

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint and tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test

      # The jar and the bundle are built inside the images below, so they are not built twice here.
      # A TypeScript or compile error still fails this job through the test and lint steps.

  publish:
    name: Publish ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            build-args: ''
          # Vite inlines these at build time, so the web image is specific to one hostname. If the
          # portal ever moves, this is the place that has to change and the image must be rebuilt -
          # the Dockerfile fails the build rather than shipping a bundle pointing at localhost.
          - name: web
            context: frontend
            # VITE_IDLE_* is the inactivity policy for client users. Passed explicitly rather
            # than left to the Dockerfile default so the figure is visible and editable in one
            # place. It is inlined into the bundle, so a change needs a rebuild and a deploy.
            # Comments live out here: build-args is parsed as KEY=VALUE lines and a "#" inside it
            # would be read as an argument name, not as a comment.
            build-args: |
              VITE_OIDC_AUTHORITY=https://app.visiondigitallab.com/realms/visionone
              VITE_OIDC_REDIRECT_URI=https://app.visiondigitallab.com/
              VITE_IDLE_TIMEOUT_MINUTES=15
              VITE_IDLE_WARNING_SECONDS=60

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/visionone-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # One architecture on purpose. The server is x86_64, and building arm64 as well would
          # double the time for an image nothing pulls.
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives with the Action, so a deploy that changes one Java file does not
          # re-resolve Gradle's whole dependency graph.
          cache-from: type=gha
          cache-to: type=gha,mode=max
